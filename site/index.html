<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pecki!less</title>
  <meta name="description" content="Camera-based health intelligence: measure 5 vital signs with just your smartphone.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233ddc97'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Inter+Tight:wght@500..900&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/scenes.css">
</head>
<body>
  <!-- Persistent chrome. Desktop: a frame box (contain-fit to the top of the
       viewport) so the bar sits exactly where it is in the frames. -->
  <div class="chrome fbox" data-host="viewport" data-fit="contain-top" data-m-fit="none">
    <header class="nav" id="nav">
      <a class="nav__logo" href="#top" aria-label="Pecki!less home"><img src="assets/svg/logo.svg" alt="" decoding="async"></a>
      <nav aria-label="Primary">
        <ul class="nav__links">
          <li style="--x:368.5"><a href="#">Technology</a></li>
          <li style="--x:471"><a href="#">Business</a></li>
          <li style="--x:555"><a href="#">Use Cases</a></li>
          <li style="--x:651"><a href="#">Regulatory</a></li>
          <li style="--x:747.2"><a href="#">Awards</a></li>
          <li style="--x:823.6"><a href="#">FAQ</a></li>
        </ul>
      </nav>
      <a class="nav__cta" href="#contact">Contact us</a>
    </header>
  </div>

  <main id="top">
    <!-- Tall scroll track; its height is set from js/config.js. -->
    <div class="track" id="track">
      <!-- Pinned full-screen stage. Every scene layer is a child of #stage. -->
      <div class="stage" id="stage" aria-live="off"></div>
    </div>
    <!-- "Contact us" target: the end of the film (S9 finale). -->
    <span id="contact"></span>
  </main>

  <!-- Debug overlay (visible with ?debug) -->
  <aside class="debug" id="debug" hidden aria-hidden="true"></aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/MotionPathPlugin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/DrawSVGPlugin.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
